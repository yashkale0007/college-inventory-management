<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f5"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#580e0e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Badges -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="#800000" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="#800000" stroke-width="3"/>

  <!-- College Sanskrit Motto Arch -->
  <path id="topArch" d="M 65 250 A 185 185 0 0 1 435 250" fill="none"/>
  <text font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" fill="#800000" letter-spacing="3.5">
    <textPath href="#topArch" startOffset="50%" text-anchor="middle">
      श्री शिवाजी विज्ञान महाविद्यालय, अमरावती
    </textPath>
  </text>

  <!-- Central Scientific Atom Orbits -->
  <g transform="translate(250,230)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="130" ry="46" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.85" transform="rotate(30)"/>
    <circle cx="112" cy="65" r="7" fill="#1d4ed8"/>
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="130" ry="46" fill="none" stroke="#059669" stroke-width="3" opacity="0.85" transform="rotate(-30)"/>
    <circle cx="-112" cy="65" r="7" fill="#047857"/>
    <!-- Orbit 3 (Horizontal) -->
    <ellipse cx="0" cy="0" rx="130" ry="46" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.85" transform="rotate(90)"/>
    <circle cx="0" cy="-130" r="7" fill="#b91c1c"/>

    <!-- Central Scientific Triangle -->
    <polygon points="0,-75 68,52 -68,52" fill="url(#maroonGrad)" stroke="#f59e0b" stroke-width="5" filter="url(#shadow)"/>

    <!-- Sacred Lamp / Diya of Knowledge inside Triangle -->
    <!-- Diya Base -->
    <path d="M -30 25 Q 0 42 30 25 Q 18 36 -30 25" fill="#f59e0b"/>
    <ellipse cx="0" cy="25" rx="30" ry="7" fill="#d97706"/>
    <!-- Eternal Flame -->
    <path d="M 0 25 C -14 10 -16 -15 0 -45 C 16 -15 14 10 0 25 Z" fill="url(#flameGrad)" filter="url(#shadow)"/>
    <ellipse cx="0" cy="-5" rx="6" ry="14" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Bottom Banner Ribbon -->
  <g transform="translate(250, 400)">
    <!-- Ribbon Shadow/Folds -->
    <path d="M -160 15 L -190 35 L -160 45 Z" fill="#991b1b"/>
    <path d="M 160 15 L 190 35 L 160 45 Z" fill="#991b1b"/>
    
    <!-- Main Ribbon Plate -->
    <rect x="-170" y="5" width="340" height="50" rx="6" fill="url(#maroonGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
    <!-- Sanskrit Motto text -->
    <text x="0" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#fef08a" text-anchor="middle" letter-spacing="4">
      विद्वान् सर्वत्र पूज्यते
    </text>
  </g>

  <!-- Sub-label ESTD -->
  <text x="250" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="3">
    ESTD. 1958 • NAAC 'A+' GRADE (CGPA 3.42)
  </text>
</svg>
